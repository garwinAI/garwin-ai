name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garwin
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway values for the CI database only; not used anywhere else.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/garwin
      AUTH_SECRET: ci-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e -- --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
